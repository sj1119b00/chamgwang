<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>프로메테우스 · PROMETHEUS</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;z-index:5;
    opacity:0;transition:opacity .6s;flex-wrap:wrap;justify-content:center;max-width:96vw}
  #hud.on{opacity:1}
  .k{cursor:pointer;padding:9px 14px 8px;border:1px solid rgba(255,255,255,.18);background:rgba(8,6,16,.55);
    backdrop-filter:blur(6px);border-radius:3px;font-size:13px;letter-spacing:.04em;color:#cfd6ff;
    clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:background .15s,color .15s;touch-action:none}
  .k:hover{background:rgba(90,200,255,.18);color:#fff}
  .k.act{background:rgba(255,40,70,.45);color:#fff}
  .k b{display:inline-block;min-width:16px;margin-right:7px;padding:1px 6px;background:#fff;color:#000;font-weight:900;font-size:12px;border-radius:2px;text-align:center}
  .k.ult b{background:#ff2a4a;color:#fff}
  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 60%,#1c0b2a 0%,#050308 70%);cursor:pointer;transition:opacity .5s}
  #start h1{margin:0;font-size:min(22vw,190px);line-height:1;letter-spacing:.06em;font-weight:900;
    font-family:"Black Han Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:linear-gradient(180deg,#fff 30%,#ff9aa8 60%,#ff1f45);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(255,40,80,.55))}
  #start .en{letter-spacing:1.1em;font-size:13px;color:#ffb3c0;margin:14px 0 40px 1.1em}
  #start .pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  #start .card{--c:#ff3355;width:150px;padding:16px 10px 14px;border:1px solid var(--c);text-align:center;cursor:pointer;border-radius:4px;
    background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(0,0,0,.45));box-shadow:0 0 22px color-mix(in srgb,var(--c) 35%,transparent);transition:transform .15s}
  #start .card:hover{transform:translateY(-4px)}
  #start a.card{text-decoration:none}
  #start .card i{display:block;font-style:normal;font-size:28px;font-weight:900;font-family:"Black Han Sans","Malgun Gothic",sans-serif;color:#fff}
  #start .card em{display:block;font-style:normal;font-size:10px;letter-spacing:.28em;color:var(--c);margin-top:4px}
  #start .card small{display:block;margin-top:9px;color:#b9b3d0;font-size:11px}
  #cls{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));display:flex;gap:6px;z-index:6;opacity:0;transition:opacity .6s}
  #cls.on{opacity:1}
  #cls .c{padding:6px 13px;border:1px solid rgba(255,255,255,.22);border-radius:14px;font-size:12px;background:rgba(8,6,16,.6);cursor:pointer;color:#cfd6ff;touch-action:none}
  #cls .c.on{color:#fff;border-color:#fff;background:rgba(255,255,255,.18);box-shadow:0 0 12px rgba(255,255,255,.35)}
  #cls.busy .c{opacity:.35}
  #start .sub{margin-top:26px;font-size:12px;color:#8a84a8;letter-spacing:.08em;text-align:center;line-height:1.9}
  #start .sub.touch{display:none}
  #toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:8;padding:10px 18px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.25);
    border-radius:20px;font-size:13px;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
  #hud.busy .k:not([data-a=basic]):not(.demo){opacity:.35;filter:grayscale(.6)}
  .k.ult{border-color:var(--uc,#ff3355)}
  /* touch devices (html.touch is set from JS) */
 html.touch #start .sub{display:none} html.touch #start .sub.touch{display:block}
 html.touch #start h1{font-size:min(28vw,20vh,190px)} html.touch #start .en{margin:8px 0 3vh .9em;font-size:11px}
 html.touch #start .card{width:min(17.5vw,130px);padding:10px 6px} html.touch #start .card i{font-size:22px} html.touch #start .sub{margin-top:14px}
 html.touch #hud{left:auto;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));transform:none;
      display:grid;grid-template-columns:repeat(3,74px);gap:10px;max-width:none}
 html.touch .k{width:74px;height:74px;padding:4px;word-break:keep-all;text-align:center;line-height:1.15;border-radius:50%;clip-path:none;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
      font-size:12px;font-weight:800;color:#fff;letter-spacing:0;background:radial-gradient(circle at 50% 35%,rgba(90,200,255,.32),rgba(8,6,16,.72) 70%);
      border:1.5px solid rgba(160,230,255,.55);box-shadow:0 0 14px rgba(80,200,255,.35),inset 0 0 12px rgba(80,200,255,.25);transition:transform .08s,opacity .2s}
 html.touch .k b{display:none}
 html.touch .k.press{transform:scale(.88);background:rgba(255,255,255,.4)}
 html.touch .k.ult{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--uc,#ff3355) 55%,transparent),rgba(10,4,14,.85) 70%);border-color:var(--uc,#ff3355);
      box-shadow:0 0 22px var(--uc,#ff3355),inset 0 0 14px color-mix(in srgb,var(--uc,#ff3355) 40%,transparent);animation:ultp 1.6s infinite}
 html.touch .k.demo{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(50px + env(safe-area-inset-top));width:auto;height:32px;padding:0 14px;border-radius:16px;font-size:11px}
 html.touch .k.demo.act{background:rgba(255,40,70,.6)}
  @media (orientation:portrait){
 html.touch #start .card{width:min(40vw,150px)} html.touch #start .pick{gap:8px}
 html.touch #hud{left:0;right:0;margin:0 auto;width:max-content;grid-template-columns:repeat(3,min(29vw,112px))}
 html.touch .k{width:auto;height:62px;border-radius:16px}
  }
  @keyframes ultp{50%{box-shadow:0 0 36px var(--uc,#ff3355),inset 0 0 20px var(--uc,#ff3355)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,50,80,0)}50%{box-shadow:0 0 28px rgba(255,50,80,.7)}}
</style>
</head>
<body>
<canvas id="out"></canvas>
<canvas id="top" style="pointer-events:none"></canvas>
<script src="engine/core.js?v=2"></script>
<script src="rpg.js?v=63"></script>
<script>if(/[?&]frame(=|&|$)/.test(location.search)){ if(window.RPG) RPG.noSave=true; document.write('<script src="frame/boot.js?v=2" onerror="if(window.RPG)RPG.noSave=false"><\/script>'); }</script>
<script>if(/[?&](heat|frame)(=|&|$)/.test(location.search)) document.write('<script src="frame/heat.js"><\/script>');</script>
<script>document.write('<script src="sword-sfx/ingame.js?v='+(/[?&]frame(=|&|$)/.test(location.search)?7:6)+'"><\/script>');</script>
</body>
</html>
